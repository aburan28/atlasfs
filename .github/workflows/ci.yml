name: CI

on:
  # Every branch, not just main: a CI config that only runs once a change
  # has already landed cannot stop anything from landing.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The FUSE tests (pkg/fuseserver, pkg/csidriver) skip themselves when
      # /dev/fuse is missing. That is the right behavior for a developer
      # laptop and the wrong behavior for CI: a silent skip of the only
      # tests that exercise a real kernel mount is indistinguishable from a
      # pass. Fail loudly here instead, so losing /dev/fuse on the runner
      # shows up as a broken build rather than a quietly narrower one.
      - name: Require /dev/fuse
        run: |
          test -c /dev/fuse || {
            echo "::error::/dev/fuse missing — the FUSE tests would silently skip"
            exit 1
          }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        # -timeout well under the job ceiling: a hung FUSE test used to
        # burn eleven minutes before Go dumped goroutines, and the dump
        # did not even name the test. Failing in five is cheaper.
        timeout-minutes: 8
        run: go test ./... -count=1 -timeout 5m

      - name: go test -race
        # -race is slower, so it gets a larger budget than the plain run —
        # still bounded, for the same reason.
        timeout-minutes: 15
        run: go test ./... -count=1 -race -timeout 10m

      # Benchmarks are compiled and run for one iteration only: this is a
      # correctness gate (a benchmark that no longer builds or panics is a
      # broken benchmark), not a performance gate. Timing on a shared CI
      # runner is too noisy to threshold against — the real numbers in
      # README.md come from a dedicated run, not from here.
      - name: benchmarks compile and run
        # -timeout is the point: a benchmark that wedges should fail this
        # step in minutes, not sit until the job's own hour-long ceiling.
        # An unbounded benchmark step already cost one run that way.
        timeout-minutes: 10
        run: go test ./... -run '^$' -bench . -benchtime 1x -timeout 5m
